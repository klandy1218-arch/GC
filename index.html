<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Chase Classic</title>
  <link rel="stylesheet" href="styles.css?v=20260822-2">
</head>
<body>
  <header class="topbar">
    <h1>Grand Chase Classic</h1>
    <p>Jeff Tool </p>
  </header>

  <main class="app-shell">
    <div class="tab-head" id="mainTabs">
      <button class="tab-btn active" data-tab="fashionTab">魔珠時裝</button>
      <button class="tab-btn" data-tab="damageTab">傷害試算</button>
    </div>

    <section id="fashionTab" class="tab-panel active">
      <div class="layout-grid">
        <aside class="card left-panel">
          <h2>配裝控制</h2>
          <p class="hint">在右側表格直接點選各部位賽季；最佳組合的權重總和需等於 10。</p>

          <div class="total-panel card-inline">
            <h3>Total Stats</h3>
            <div id="totalStats" class="total-stats-grid"></div>
          </div>

          <div class="season-control-block">
            <h3>全部套用賽季</h3>
            <p class="hint">點一下即可把所有部位切換成相同賽季。</p>
            <div id="quickSeasonButtons" class="season-button-grid" aria-label="全部套用賽季"></div>
          </div>

          <div class="btn-row">
            <button id="optimizeBtn">Find Best Combo</button>
            <button id="pauseBtn" disabled>Pause</button>
          </div>

          <div id="optimizationProgress" class="optimization-progress" aria-live="polite">
            <div class="progress-label">
              <span>搜尋進度</span>
              <span id="progressText">等待搜尋</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>

          <div class="weights card-inline">
            <h3>權重設定</h3>
            <div id="weightRows"></div>
            <div class="weight-foot">
              <button id="applyDefaultBtn">套用預設權重</button>
              <span id="weightSum">Weight Sum: 0/10</span>
            </div>
          </div>

          <div class="exclude-options card-inline">
            <h3>最佳組合排除賽季</h3>
            <p class="hint">選取後，Find Best Combo 將不會使用該賽季。</p>
            <div id="excludedSeasonButtons" class="season-button-grid" aria-label="搜尋排除賽季"></div>
          </div>

          <p id="statusLine" class="status">Ready</p>
        </aside>

        <section class="card right-panel">
          <div id="overviewContent"></div>
        </section>
      </div>
    </section>

    <section id="damageTab" class="tab-panel">
      <div class="card placeholder">
        <h2>傷害試算</h2>
        <p>此分頁先保留，後續可加入傷害公式與技能倍率設定。</p>
      </div>
    </section>
  </main>

  <script src="list-data.js?v=20260822-2"></script>
  <script src="app.js?v=20260822-2"></script>
</body>
</html>
